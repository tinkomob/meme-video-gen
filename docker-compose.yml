services:
  meme-video-gen:
    image: meme-video-gen:latest
    build: .
    container_name: meme-video-gen-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    networks:
      - meme_network
    ulimits:
      nproc:
        soft: 65535
        hard: 65535
      nofile:
        soft: 65535
        hard: 65535
    # Set to 0.9 * available logical CPUs (e.g. 5.4 on a six-core host).
    # Shared by the bot, visualizer workers and FFmpeg; no core affinity restriction.
    cpus: "${SNIPPET_CPU_LIMIT:?Set SNIPPET_CPU_LIMIT to 90 percent of available CPUs}"
    pids_limit: 512
    init: true

networks:
  meme_network:
    driver: bridge